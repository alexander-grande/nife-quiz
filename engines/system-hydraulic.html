<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydraulic System Diagram | NIFE 2642</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../style.css?v=r2">
<script src="../analytics.js"></script>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0d1421">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js");</script>
</head>
<body>
<div class="wrap wide">

  <a href="./" class="back-link">&larr; All Engines Tests</a>
  <header>
    <div class="eyebrow">Engines &middot; Unit 2 of 5 &middot; System Diagrams</div>
    <h1>Hydraulic System</h1>
    <div class="sub">Fill in every blanked-out part name &middot; Figure 3.5-11</div>
  </header>

  <!-- SETUP SCREEN -->
  <div id="setup-screen">
    <div class="center-box">
      <h2>How do you want to practice?</h2>
      <div class="setup-group">
        <div class="choice-row">
          <button class="btn toggle selected" data-mode="bank">Word Bank Mode<span>All part names shown scrambled &mdash; tap a name, then tap its blank. Good for learning the diagram.</span></button>
          <button class="btn toggle" data-mode="recall">Recall Mode<span>Type each part name from memory &mdash; like the real fill-in. Spelling is graded leniently.</span></button>
        </div>
      </div>
      <button class="btn submit" id="btn-start">Start</button>
    </div>
  </div>

  <!-- EXERCISE SCREEN -->
  <div id="exercise-screen" class="hidden">
    <div class="quiz-top">
      <span class="test-name" id="exercise-mode-label"></span>
      <span class="counter" id="score-line"></span>
    </div>

    <div class="diagram-frame">
      <img src="img/hydraulic.png" alt="Hydraulic System diagram with blanked part names" class="diagram-img">
      <div class="chip-layer" id="chip-layer"></div>
    </div>

    <div class="word-bank hidden" id="word-bank"></div>

    <div id="answer-rows" class="answer-rows"></div>

    <div class="nav-row" style="justify-content:center;">
      <button class="btn submit" id="btn-check">Check Answers</button>
      <button class="btn primary hidden" id="btn-reset">Try Again</button>
      <button class="btn" id="btn-mode">Change Mode</button>
    </div>
  </div>

</div>

<script>const SYSTEM_ID = "hydraulic";</script>
<script src="diagrams.js?v=2"></script>
<script src="diagram-app.js?v=2"></script>
</body>
</html>
