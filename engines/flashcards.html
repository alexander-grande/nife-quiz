<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engines Flashcards | NIFE 2642</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../style.css">
<script src="../analytics.js"></script>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0d1421">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js");</script>
</head>
<body>
<div class="wrap">

  <a href="./" class="back-link">&larr; All Engines Tests</a>
  <header>
    <div class="eyebrow">Engines &middot; Unit 2 of 5</div>
    <h1>Flashcards</h1>
    <div class="sub">Mnemonics, limits, and must-know numbers &middot; tap a card to flip &middot; space/enter flips, arrows navigate</div>
  </header>

  <div class="word-bank" id="cat-bar" style="justify-content:center;"></div>

  <div class="fc-stage">
    <div class="fc-card" id="fc-card" title="Tap to flip">
      <div class="fc-inner" id="fc-inner">
        <div class="fc-face fc-front">
          <div class="fc-cat" id="fc-cat"></div>
          <div class="fc-text" id="fc-front-text"></div>
          <div class="fc-hint">tap to reveal</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-text" id="fc-back-text"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="fc-controls">
    <button class="btn" id="btn-fc-prev">&larr; Previous</button>
    <span class="counter" id="fc-counter"></span>
    <button class="btn" id="btn-fc-next">Next &rarr;</button>
  </div>
  <div class="fc-controls">
    <button class="btn" id="btn-fc-shuffle">Reshuffle Deck</button>
  </div>

</div>

<script src="flashcards.js"></script>
</body>
</html>
